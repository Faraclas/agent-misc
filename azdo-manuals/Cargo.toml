[package]
name = "azdo-manuals"
version = "7.1.0"
edition = "2021"
license = "MIT"
authors = ["Elias Faraclas"]
repository = "https://github.com/Faraclas/agent-misc"
description = "Generate utcp HTTP manuals for the Azure DevOps REST API from Microsoft's archived specs"
publish = false

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.9", features = ["derive"] }
indexmap = "2.14.2"
regex = "1.13.2"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.11.0"
tempfile = "3.27.0"
ureq = { version = "3.5.2", features = ["platform-verifier"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
