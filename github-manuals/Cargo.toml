[package]
name = "github-manuals"
version = "0.1.1"
edition = "2021"
license = "MIT"
authors = ["Elias Faraclas"]
repository = "https://github.com/Faraclas/agent-misc"
description = "Generate utcp HTTP manuals for the GitHub REST API from GitHub's OpenAPI description"
publish = false

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
indexmap = "2.14.2"
regex = "1.13.2"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.10.9"
ureq = { version = "3.5.2", features = ["platform-verifier"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
