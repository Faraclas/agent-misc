[workspace]
resolver = "2"
members = [
    "crates/utcp-core",
    "crates/utcp-cli",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"
authors = ["Elias Faraclas"]
repository = "https://github.com/Faraclas/agent-misc"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
bincode = "1.3"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.28"
directories = "5.0"
dotenvy = "0.15"
eventsource-stream = "0.2"
fs2 = "0.4"
futures = "0.3"
notify = "8.2"
once_cell = "1.19"
pin-project = "1.1"
ratatui = { version = "0.29", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "gzip",
    "deflate",
    "brotli",
    "http2",
    "rustls-tls-native-roots",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = "0.9"
sha2 = "0.10"
tempfile = "3"
thiserror = "1.0"
tokio = { version = "1.38", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "fs",
    "process",
    "sync",
    "time",
    "signal",
] }
tokio-tungstenite = { version = "0.24", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-native-roots",
] }
toml = "0.8"
# Edits one line of settings.toml and keeps the user's comments (already in the lock file through toml).
toml_edit = { version = "0.22", default-features = false, features = ["parse", "display"] }
url = "2.5"
urlencoding = "2.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
