[package]
name = "utcp-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Core Universal Tool Calling Protocol (UTCP) engine, OpenAPI ingest, bincode index, and local IPC daemon/client."

[features]
default = ["mcp"]
mcp = []
grpc = ["dep:prost", "dep:prost-types", "dep:tonic"]
webrtc = ["dep:webrtc"]
codemode = ["dep:rhai", "dep:smartstring"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
bincode.workspace = true
bytes.workspace = true
chrono.workspace = true
directories.workspace = true
dotenvy.workspace = true
eventsource-stream.workspace = true
fs2.workspace = true
futures.workspace = true
notify.workspace = true
once_cell.workspace = true
pin-project.workspace = true
regex.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
toml.workspace = true
url.workspace = true
urlencoding.workspace = true

# Optional heavy protocol subsystems (disabled by default)
prost = { version = "0.12", optional = true }
prost-types = { version = "0.12", optional = true }
tonic = { version = "0.11", features = ["transport", "tls"], optional = true }
webrtc = { version = "0.14", optional = true }
rhai = { version = "1.18", features = ["serde"], optional = true }
smartstring = { version = "1.0", features = ["serde"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
axum = "0.7"
tempfile.workspace = true
tokio-stream = { version = "0.1", features = ["net"] }
uuid = { version = "1", features = ["v4"] }
