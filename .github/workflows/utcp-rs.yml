name: utcp-rs CI & Release

on:
  push:
    branches:
      - main
    paths:
      - "utcp-rs/**"
      - ".github/workflows/utcp-rs.yml"
  pull_request:
    paths:
      - "utcp-rs/**"
      - ".github/workflows/utcp-rs.yml"
  # Releases are made only from here: Actions > "utcp-rs CI & Release" > Run workflow on main, with "release"
  # ticked (or `gh workflow run utcp-rs.yml --ref main -f release=true`). The version comes from Cargo.toml.
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release for the version in utcp-rs/Cargo.toml (main only)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Reads the version from Cargo.toml. On a release run it refuses before the long builds start when the run is
  # not on main or the version is not newer than every released one.
  version:
    name: Version check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from Cargo.toml
        id: read
        working-directory: utcp-rs
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "utcp-cli") | .version')"
          [ -n "$version" ] || { echo "::error::Could not read the version from utcp-rs/Cargo.toml"; exit 1; }
          echo "utcp-rs version in Cargo.toml: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check that this version can be released
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          refuse() {
            echo "::error title=Release refused::$1"
            printf '### Release refused\n\n%s\n\nNothing was built or published.\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          how="To release your changes, raise version in utcp-rs/Cargo.toml (for example 0.1.0 -> 0.1.1),"
          how="$how push it to main, then run the release again."
          [ "$GITHUB_REF" = "refs/heads/main" ] ||
            refuse "Releases are made from main only, and this run is on ${GITHUB_REF#refs/heads/}. Run it on main."
          released="$(git ls-remote --tags --refs origin 'refs/tags/utcp-rs-v*' | sed 's|.*refs/tags/utcp-rs-v||')"
          if printf '%s\n' "$released" | grep -qxF "$VERSION"; then
            refuse "utcp-rs $VERSION is already released (tag utcp-rs-v$VERSION exists). $how"
          fi
          latest="$(printf '%s\n' "$released" | sed '/^$/d' | sort -V | tail -n 1)"
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]; then
            refuse "utcp-rs $VERSION in Cargo.toml is lower than the latest release, $latest. $how"
          fi
          echo "Releasing utcp-rs $VERSION (latest release: ${latest:-none})."

  build-and-test:
    name: Build & Test (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Runs the tests on Linux. Its glibc binary is not published: the static musl one runs on any distribution.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            test: true
          # Static Linux release binary, provided as-is (tested on Gentoo and Ubuntu 26.04, not on every distribution).
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            test: false
            archive: utcp-x86_64-unknown-linux-musl.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            test: true
            archive: utcp-x86_64-pc-windows-msvc.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # `ring` compiles C code; for the musl target that needs `musl-gcc`.
      - name: Install musl C toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: utcp-rs
          key: ${{ matrix.target }}

      # Tests run local mock servers with `node <file>` (no npm packages, no network).
      - name: Install Node.js for test mock servers
        if: matrix.test
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Run full workspace unit & dual-mode integration tests
        if: matrix.test
        working-directory: utcp-rs
        run: cargo test --workspace --locked

      - name: Build release binary
        if: matrix.archive
        working-directory: utcp-rs
        run: cargo build --release --locked -p utcp-cli --target ${{ matrix.target }}

      - name: Package Linux release archive
        if: matrix.archive && runner.os == 'Linux'
        working-directory: utcp-rs
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/utcp dist/utcp
          file dist/utcp
          file dist/utcp | grep -q 'static' || { echo "utcp is not statically linked"; exit 1; }
          ./dist/utcp --version
          ./dist/utcp sync-ides --print-skill > dist/SKILL.md
          cp docs/operating.md packaging/systemd/utcp-daemon.service ../LICENSE NOTICE \
            crates/utcp-core/LICENSE-UPSTREAM-RS-UTCP dist/
          tar -C dist -czf ${{ matrix.archive }} utcp SKILL.md operating.md utcp-daemon.service LICENSE \
            NOTICE LICENSE-UPSTREAM-RS-UTCP

      - name: Package Windows release archive
        if: matrix.archive && runner.os == 'Windows'
        working-directory: utcp-rs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\utcp.exe" "dist\utcp.exe"
          & ".\dist\utcp.exe" sync-ides --print-skill | Set-Content -Encoding UTF8 "dist\SKILL.md"
          Copy-Item "docs\operating.md", "packaging\windows\install.cmd", "packaging\windows\install.ps1", `
            "packaging\windows\README.txt", "..\LICENSE", "NOTICE", "crates\utcp-core\LICENSE-UPSTREAM-RS-UTCP" "dist\"
          Compress-Archive -Path "dist\utcp.exe", "dist\install.cmd", "dist\install.ps1", "dist\README.txt", "dist\SKILL.md", `
            "dist\operating.md", "dist\LICENSE", "dist\NOTICE", "dist\LICENSE-UPSTREAM-RS-UTCP" `
            -DestinationPath "${{ matrix.archive }}"

      # Installs from the zip the way a user would, checks the result, then uninstalls. The runner is an admin
      # account, so this does not prove the logon task works without admin rights (test that on a VM).
      - name: Test install.cmd from the release zip
        if: matrix.archive && runner.os == 'Windows'
        working-directory: utcp-rs
        shell: pwsh
        run: |
          Expand-Archive "${{ matrix.archive }}" -DestinationPath "$env:RUNNER_TEMP\utcp-zip"
          # Users need README.txt to learn the install command; a bare .\install.ps1 is blocked by default.
          if (-not (Select-String -Quiet -SimpleMatch -Path "$env:RUNNER_TEMP\utcp-zip\README.txt" `
              -Pattern '.\install.cmd')) { throw 'README.txt lacks the install command' }
          # Run it the way a user does, through install.cmd (which also must not pause outside Explorer).
          function Install-Utcp {
            & "$env:RUNNER_TEMP\utcp-zip\install.cmd" @args
            if ($LASTEXITCODE) { throw "install.cmd $args failed" }
          }
          Install-Utcp
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\utcp\utcp.exe'
          & $exe --version
          & $exe doctor
          if (-not (Test-Path "$env:USERPROFILE\.agents\skills\utcp-admin\operating.md")) { throw 'skills missing' }
          if (-not (Test-Path (Join-Path (Split-Path $exe) 'LICENSE-UPSTREAM-RS-UTCP'))) { throw 'licence files missing' }
          if (-not ([Environment]::GetEnvironmentVariable('Path', 'User') -like "*Programs\utcp*")) { throw 'not on PATH' }
          if (-not (Get-ScheduledTask -TaskName 'utcp daemon' -ErrorAction SilentlyContinue)) { throw 'no task' }
          Install-Utcp -NoDaemonAtLogon
          if (Get-ScheduledTask -TaskName 'utcp daemon' -ErrorAction SilentlyContinue) { throw 'opt-out kept task' }
          Install-Utcp
          Install-Utcp -Uninstall
          if (Test-Path $exe) { throw 'not uninstalled' }
          if (Get-ScheduledTask -TaskName 'utcp daemon' -ErrorAction SilentlyContinue) { throw 'task left' }
          if ([Environment]::GetEnvironmentVariable('Path', 'User') -like "*Programs\utcp*") { throw 'PATH left' }

      - name: Upload build artifact
        if: matrix.archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: utcp-rs/${{ matrix.archive }}

  # Only this job can write to the repository, and only after every build and test passed. It creates the tag
  # utcp-rs-v<version> on the commit that was built, together with the GitHub Release.
  release:
    name: Publish GitHub Release
    needs: [version, build-and-test]
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: utcp-rs-release
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Guards against a Cargo.toml version that the built binary does not report.
      - name: Check that the binary reports the release version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p check
          tar -xzf dist/utcp-x86_64-unknown-linux-musl.tar.gz -C check utcp
          built="$(./check/utcp --version | awk '{print $2}')"
          echo "Cargo.toml: $VERSION, binary: $built"
          [ "$built" = "$VERSION" ] || {
            echo "::error::The built binary reports $built, but utcp-rs/Cargo.toml says $VERSION"
            exit 1
          }

      # The version job checked this before the builds; check again in case another release run won meanwhile.
      - name: Check that the tag is still free
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/utcp-rs-v$VERSION" --silent 2>/dev/null; then
            echo "::error title=Release refused::utcp-rs $VERSION was released by another run meanwhile."
            exit 1
          fi

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: utcp-rs-v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: utcp-rs ${{ needs.version.outputs.version }}
          files: dist/*
          fail_on_unmatched_files: true
